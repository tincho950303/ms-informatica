services:
  - type: web
    name: ms-informatica
    runtime: static
    buildCommand: echo "Static site - no build"
    staticPublishPath: ./
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    # Plan gratuito de Render. Si usás dashboard manual:
    # New → Static Site → conectar repo → Publish directory: ./ → Build: vacío
